name: Build Elite Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libncurses5-dev flex bison clang lld llvm

      - name: Build Kernel
        run: |
          mkdir -p out
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Очистка
          make O=out ARCH=arm64 clean
          make O=out ARCH=arm64 mrproper
          
          # Конфигурация
          make O=out ARCH=arm64 vendor/spes_defconfig
          
          # Сборка с игнорированием несоответствий секций и подробным логом
          make -j2 -k O=out \
                      ARCH=arm64 \
                      CC=clang \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
                      KCFLAGS="-w" \
                      HOSTCFLAGS="-w" \
                      V=1 || true
                      
                      

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Image-Elite-Spes
          path: out/arch/arm64/boot/Image.gz-dtb
          
